[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-engine"
version = "0.1.0"
description = "Exact speculative decoding, tree-structured causal verification, and paged KV-cache rollback in JAX."
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.25",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]